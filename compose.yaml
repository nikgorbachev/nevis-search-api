services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://nevis:nevis@db:5432/nevis
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.1-pg17-bookworm@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      POSTGRES_USER: nevis
      POSTGRES_PASSWORD: nevis
      POSTGRES_DB: nevis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "nevis", "-d", "nevis"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
